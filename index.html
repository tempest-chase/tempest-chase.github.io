<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempest Chase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f8fa; color: #333; }

        .site-header {
            background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 15px 40px; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { 
            width: 48px; height: 48px; border-radius: 50%; object-fit: cover; 
        }
        .site-title { 
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px; 
            color: #222; 
        }
        .back-btn {
            background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 20px;
            cursor: pointer; font-size: 0.9rem; color: #555; transition: 0.2s; display: none;
        }
        .back-btn:hover { background: #f0f0f0; }
        .search-box input {
            padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; width: 220px;
            font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        .search-box input:focus { border-color: #5a9; box-shadow: 0 0 0 3px rgba(85,170,153,0.15); }

        .intro { text-align: center; padding: 40px 20px 20px; max-width: 700px; margin: 0 auto; color: #555; font-size: 1.1rem; line-height: 1.7; }
        .intro strong { color: #333; }

        .albums-container {
            display: flex; flex-wrap: wrap; justify-content: center; max-width: 1200px;
            margin: 0 auto; padding: 20px; gap: 24px;
        }
        .photos-container { display: none; }

        .album-card, .photo-card {
            background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            overflow: hidden; width: 300px; transition: transform 0.25s, box-shadow 0.25s; cursor: pointer;
        }
        .album-card:hover, .photo-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
        .album-card img, .photo-card img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .album-info, .photo-info { padding: 16px; }
        .album-title, .photo-title { font-weight: 600; font-size: 1rem; color: #222; margin-bottom: 6px; }
        .album-desc, .photo-desc { font-size: 0.85rem; color: #666; line-height: 1.5; }
        .photo-desc { margin-bottom: 12px; }
        .download-btn {
            display: inline-block; background: #5a9; color: white; text-decoration: none;
            padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; transition: 0.2s;
        }
        .download-btn:hover { background: #489; }

        .no-result { text-align: center; padding: 60px 20px; color: #aaa; font-size: 1.2rem; display: none; }
        footer { text-align: center; padding: 40px 20px; color: #bbb; font-size: 0.85rem; }

        .album-intro {
            max-width: 1200px;
            margin: 40px auto 20px;
            padding: 20px 20px 10px;
            text-align: center;
            font-size: 1rem;
            color: #333;
            line-height: 1.8;
            background: #f0f8ff;
        }
        .album-intro .intro-bracket {
            color: #007bff;
            font-size: 1.3em;
            font-weight: bold;
            vertical-align: middle;
            margin: 0 0.4em;
        }

        .video-link-wrapper {
            text-align: center;
            margin: 20px auto 30px;
            max-width: 1200px;
            padding: 0 20px;
        }
        .video-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fb7299;
            color: white;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }
        .video-btn:hover {
            background: #e05a7f;
            transform: scale(1.03);
        }
        .bili-tv-icon {
            display: inline-block;
            width: 1.2em;
            height: 1.2em;
            vertical-align: middle;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 300px);
            gap: 24px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-area">
            <img class="logo-img" src="logo.jpg" alt="Logo">
            <span class="site-title">Tempest Chase V1</span>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="back-btn" id="backBtn" onclick="goBackToAlbums()">← 返回相册列表</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索…">
            </div>
        </div>
    </header>

    <div class="intro" id="introText">
        <p>📷 这里是<strong>华南气象爱好者的追风小分队</strong></p>
        <p>记录团队追逐过的风暴。点击相册浏览照片，所有图片均可下载</p>
        <p><strong>(网站搭建中，敬请期待）</strong></p>
    </div>

    <div class="albums-container" id="albumsContainer"></div>
    <div class="photos-container" id="photosContainer"></div>
    <div class="no-result" id="noResult">😕 没有找到匹配的项目，换个关键词试试吧。</div>
    <footer>© 2026 Tempest Chase · 所有照片均可自由下载</footer>

    <script>
        // =============================================
        // 👇 相册数据（文件夹名和文件名已改为英文）
        // =============================================
        const albums = [
            {
                id: 'mujigae',
                title: '台风桦加沙',
                description: '珠三角自2018年以来影响最强台风',
                introDetail: '这，是我们追击的第一个超强台风！我们深入了"桦加沙"的狂暴外眼墙，直击13级以上的强阵风，完整记录下了珠海金湾在这场台风影响下的全过程！',
                cover: 'ragasa/ragasaphoto1.jpg',
                keywords: '桦加沙',
                videoTitle: '桦加沙追风视频',
                videoUrl: 'https://www.bilibili.com/video/BV1GZHnzDEQk/',
                photos: [
                    { src: 'ragasa/ragasaphoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'ragasa/ragasaphoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'ragasa/ragasaphoto3.jpg', title: '照片3', desc: '这里是照片简介' }
                ]
            },
            {
                id: 'matmo',
                title: '台风麦德姆',
                description: '团队首次进入成熟的台风眼区',
                introDetail: '在"桦加沙"远去之后，西太的疯狂仍未停止，接下来赶到战场的便是强台风"麦德姆"。而我们的追风小队，再一次踏上了追风的征途，我们穿越了它的眼墙，直击它的风眼，同时在眼内看到了国内少有的风眼蓝天的场面，完整记录下了湛江在这场台风影响下的全过程！',
                cover: 'matmo/matmophoto1.jpg',
                keywords: '麦德姆',
                videoTitle: '麦德姆眼内实拍',
                videoUrl: 'https://www.bilibili.com/video/BV1Ea4ezCEwX/',
                photos: [
                    { src: 'matmo/matmophoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'matmo/matmophoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'matmo/matmophoto3.jpg', title: '照片3', desc: '这里是照片简介' }
                ]
            },
            {
                id: 'bavi',
                title: '台风巴威',
                description: '20年代厄年远洋台风先驱',
                introDetail: '2020-2025年，西北太平洋连续六年拉尼娜，自此，远洋超台几乎销声匿迹。而在超强厄尔尼诺到来的2026年，"巴威"横空出世，而它的诞生，也将突破这六年的常态，创造西北太平洋的新佳话......',
                cover: 'bavi/baviphoto1.jpg',
                keywords: '巴威',
                videoTitle: '巴威地球风云系列视频',
                videoUrl: 'https://www.bilibili.com/video/BV1n93463E3H/',
                photos: [
                    { src: 'bavi/baviphoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto3.jpg', title: '照片3', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto4.jpg', title: '照片4', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto5.jpg', title: '照片5', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto6.jpg', title: '照片6', desc: '这里是照片简介' },
                    { src: 'bavi/baviphoto7.jpg', title: '照片7', desc: '这里是照片简介' }
                ]
            },
            {
                id: 'noul',
                title: '台风红霞',
                description: '珠东地区自2003年以来影响最强台风',
                introDetail: '珠东地区2003年以来最强台风',
                cover: 'noul/noulphoto1.jpg',
                keywords: '红霞',
                videoTitle: '红霞登陆地实拍',
                videoUrl: 'https://www.bilibili.com/video/BV13Z3E6iE77/',
                photos: [
                    { src: 'noul/noulphoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'noul/noulphoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'noul/noulphoto3.jpg', title: '照片3', desc: '这里是照片简介' }
                ]
            },
            {
                id: 'thunderstorm',
                title: '雷暴合集',
                description: '用镜头捕捉天地间最原始的咆哮',
                introDetail: '大自然最磅礴的呼吸——雷暴云团。它们是天空的雕塑家最狂放的杰作：夕阳将砧状云顶熔炼成通红的铁毡，云塔在暮色中无声坍塌又耸起，闪电如根须般在云腹中密布游走，刹那照亮大地的轮廓',
                cover: 'storm/stormphoto1.jpg',
                keywords: '强对流 雷暴',
                videoTitle: '2026雷暴追击视频',
                videoUrl: 'https://www.bilibili.com/video/BV1AeL36CEGn/',
                photos: [
                    { src: 'storm/stormphoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'storm/stormphoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'storm/stormphoto3.jpg', title: '照片3', desc: '这里是照片简介' },
                    { src: 'storm/stormphoto4.png', title: '照片4', desc: '这里是照片简介' },
                    { src: 'storm/stormphoto5.png', title: '照片5', desc: '这里是照片简介' },
                    { src: 'storm/stormphoto6.png', title: '照片6', desc: '这里是照片简介' }
                ]
            },
            {
                id: 'snow',
                title: '雪原合集',
                description: '记录那些被风雪覆盖的屋檐、树梢与足迹',
                introDetail: '平日里喧嚣的街道被白色轻轻覆盖，熟悉的楼宇藏在蓬松的轮廓里，连时间都仿佛放慢了脚步。车轮碾过积雪的声音变得沉闷，行人的交谈被吸入柔软的雪被，整座城市像被按下了静音键——雪没收了所有急躁，只留下它自己的语言',
                cover: 'snow/snowphoto1.jpg',
                keywords: '降雪 雪',
                videoTitle: '雪原摄影视频',
                videoUrl: 'https://www.bilibili.com/video/BV1rhkxBjExL/',
                photos: [
                    { src: 'snow/snowphoto1.jpg', title: '照片1', desc: '这里是照片简介' },
                    { src: 'snow/snowphoto2.jpg', title: '照片2', desc: '这里是照片简介' },
                    { src: 'snow/snowphoto3.jpg', title: '照片3', desc: '这里是照片简介' },
                    { src: 'snow/snowphoto4.jpg', title: '照片4', desc: '这里是照片简介' },
                    { src: 'snow/snowphoto5.jpg', title: '照片5', desc: '这里是照片简介' },
                    { src: 'snow/snowphoto6.jpg', title: '照片6', desc: '这里是照片简介' }
                ]
            }
        ];

        // ================ 引擎 ================
        let currentAlbumId = null;

        function renderAlbums(filterKeyword = '') {
            const container = document.getElementById('albumsContainer');
            container.innerHTML = '';
            const keyword = filterKeyword.toLowerCase().trim();
            let hasVisible = false;
            albums.forEach(album => {
                if (keyword && !album.keywords.toLowerCase().includes(keyword) && !album.title.toLowerCase().includes(keyword)) {
                    return;
                }
                hasVisible = true;
                const card = document.createElement('div');
                card.className = 'album-card';
                card.setAttribute('data-keywords', album.keywords);
                card.innerHTML = `
                    <img src="${album.cover}" alt="${album.title}">
                    <div class="album-info">
                        <div class="album-title">${album.title}</div>
                        <div class="album-desc">${album.description}</div>
                    </div>
                `;
                card.addEventListener('click', () => openAlbum(album.id));
                container.appendChild(card);
            });
            document.getElementById('noResult').style.display = hasVisible ? 'none' : 'block';
            if (!hasVisible) document.getElementById('noResult').textContent = '😕 没有找到匹配的相册，换个关键词试试吧。';
        }

        function openAlbum(albumId) {
            const album = albums.find(a => a.id === albumId);
            if (!album) return;
            currentAlbumId = albumId;
            document.getElementById('albumsContainer').style.display = 'none';
            document.getElementById('introText').style.display = 'none';
            document.getElementById('photosContainer').style.display = 'block';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('searchInput').value = '';
            renderPhotos(album);
        }

        function goBackToAlbums() {
            currentAlbumId = null;
            document.getElementById('albumsContainer').style.display = 'flex';
            document.getElementById('introText').style.display = 'block';
            document.getElementById('photosContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('searchInput').value = '';
            document.getElementById('noResult').style.display = 'none';
            renderAlbums();
        }

        function getBiliTvIcon() {
            return `
            <svg class="bili-tv-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="20" height="15" rx="2" fill="none" stroke="white" stroke-width="2"/>
                <polygon points="10,8 16,12 10,16" fill="white"/>
                <line x1="5" y1="20" x2="19" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <line x1="7" y1="22" x2="17" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>`;
        }

        function renderPhotos(album, filterKeyword = '') {
            const container = document.getElementById('photosContainer');
            container.innerHTML = '';

            const introText = album.introDetail || album.description;
            const introDiv = document.createElement('div');
            introDiv.className = 'album-intro';
            introDiv.innerHTML = `<span class="intro-bracket">「</span>${introText}<span class="intro-bracket">」</span>`;
            container.appendChild(introDiv);

            if (album.videoTitle && album.videoUrl) {
                const linkWrapper = document.createElement('div');
                linkWrapper.className = 'video-link-wrapper';
                linkWrapper.innerHTML = `
                    <a class="video-btn" href="${album.videoUrl}" target="_blank">
                        ${getBiliTvIcon()}
                        ${album.videoTitle}
                    </a>`;
                container.appendChild(linkWrapper);
            }

            const gridDiv = document.createElement('div');
            gridDiv.className = 'photos-grid';
            const keyword = filterKeyword.toLowerCase().trim();
            let hasVisible = false;
            album.photos.forEach(photo => {
                const combined = (photo.title + ' ' + photo.desc).toLowerCase();
                if (keyword && !combined.includes(keyword)) return;
                hasVisible = true;
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="${photo.title}">
                    <div class="photo-info">
                        <div class="photo-title">${photo.title}</div>
                        <div class="photo-desc">${photo.desc}</div>
                        <a class="download-btn" href="${photo.src}" download>⬇ 下载原图</a>
                    </div>
                `;
                gridDiv.appendChild(card);
            });
            container.appendChild(gridDiv);

            const noResult = document.getElementById('noResult');
            if (!hasVisible && keyword !== '') {
                noResult.style.display = 'block';
                noResult.textContent = '😕 这个相册里没有匹配的照片，换个词试试。';
            } else {
                noResult.style.display = 'none';
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value;
            if (currentAlbumId === null) {
                renderAlbums(keyword);
            } else {
                const album = albums.find(a => a.id === currentAlbumId);
                if (album) renderPhotos(album, keyword);
            }
        });

        renderAlbums();
    </script>
</body>
</html>
